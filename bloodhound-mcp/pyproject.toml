[project]
name = "bloodhound-mcp"
version = "0.1.0"
description = "MCP server exposing BloodHound's Neo4j graph as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "neo4j>=5.24",
    "python-dotenv>=1.0",
]

[project.scripts]
bloodhound-mcp = "bloodhound_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloodhound_mcp"]
