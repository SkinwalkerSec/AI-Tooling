[project]
name = "mythic-mcp"
version = "0.1.0"
description = "MCP server exposing Mythic C2 operator actions as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "mythic>=0.2.10",
    "python-dotenv>=1.0",
]

[project.scripts]
mythic-mcp = "mythic_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mythic_mcp"]
