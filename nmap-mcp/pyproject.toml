[project]
name = "nmap-mcp"
version = "0.1.0"
description = "MCP server exposing nmap scans as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
nmap-mcp = "nmap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmap_mcp"]
